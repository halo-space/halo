[workspace]
members = [
  "core",
  "halo",
  "rest",
  "rsctl",
  "utils",
  "macros",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/halo-space/halo.git"
readme = "README.md"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
pest = "2"
pest_derive = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

